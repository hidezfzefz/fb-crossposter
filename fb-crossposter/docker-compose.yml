# One-command backend for the FB Post Copier extension.
#
#   docker compose up -d --build      start (builds on first run)
#   docker compose logs -f            watch the automation log
#   docker compose down               stop
#
# Host ports: the dashboard is on http://localhost:5000 and the extension connects
# to ws://localhost:8766 (set that URL in the extension popup).
# 8766 rather than 8765 on purpose: 8765 is a common port for other local tools, and
# if something else already holds it Docker silently starts the container with NO
# published ports at all. Port is already in use? Pick another:
#   FB_COPIER_WS_PUBLISH=9000 docker compose up -d
# (also usable: docker compose exec fb-post-copier python fbctl.py status)
services:
  fb-post-copier:
    build: ./python_backend
    image: fb-post-copier:latest
    container_name: fb-post-copier
    restart: unless-stopped
    ports:
      - "${FB_COPIER_WS_PUBLISH:-8766}:8765"   # WebSocket for the Firefox extension
      - "5000:5000"                            # dashboard + fbctl
    environment:
      # Farm starts as soon as the extension connects (remove to control manually).
      FB_COPIER_AUTOSTART: "true"
      # Active-hours scheduling uses local time inside the container:
      # TZ: "Europe/Berlin"
      #
      # Push notifications (optional; also configurable in the dashboard):
      # FB_COPIER_NTFY_URL: "https://ntfy.sh/my-fb-topic"
      # FB_COPIER_WEBHOOK_URL: "https://discord.com/api/webhooks/..."
      # FB_COPIER_TELEGRAM_TOKEN: "123456:ABC..."
      # FB_COPIER_TELEGRAM_CHAT_ID: "123456789"
      # KNOCK_API_KEY: "sk_..."
    volumes:
      - fb-copier-data:/app/data

volumes:
  fb-copier-data:
